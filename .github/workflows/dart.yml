name: Dart CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dart-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test bin example

      - name: Analyse package sources
        run: dart analyze lib test bin

      - name: Run deterministic tests
        shell: bash
        run: |
          tests=(
            test/channel_id_test.dart
            test/playlist_id_test.dart
            test/username_test.dart
            test/video_id_test.dart
          )

          # Runtime PRs may add fake-client tests. Include those in the merge
          # gate when present, without executing mutable YouTube network/parser
          # integration tests on hosted runners.
          for optional_test in \
            test/video_controller_test.dart \
            test/stream_transport_test.dart; do
            if [[ -f "$optional_test" ]]; then
              tests+=("$optional_test")
            fi
          done

          dart test "${tests[@]}"
